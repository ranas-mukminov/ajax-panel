version: '3.8'

services:
  grafana-ajax:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: grafana-ajax-panel
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_PATHS_PLUGINS=/var/lib/grafana/plugins
      - GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS=ryantxu-ajax-panel
    restart: unless-stopped
    networks:
      - ajax-panel-net
    depends_on:
      - ajax-demo-backend

  ajax-demo-backend:
    build:
      context: ./demo-backend
      dockerfile: Dockerfile
    container_name: ajax-demo-backend
    ports:
      - "8080:8080"
    restart: unless-stopped
    networks:
      - ajax-panel-net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  ajax-panel-net:
    driver: bridge

volumes:
  grafana_data:
    driver: local
